<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Batalha - Crypto Clash</title>
  <link rel="stylesheet" href="battle-scene.css">
</head>
<body>
  <div class="battle-container">
    <h1>Bem-vindo à Batalha!</h1>
    <div id="faction-banner" class="faction-banner"></div>
    <div class="battle-animation">
      <div id="animation-placeholder" class="animation-placeholder">
        <span>Iniciando Batalha...</span>
      </div>
    </div>
    <button id="startBattleBtn">Iniciar Batalha</button>
  </div>

  <script src="battle-scene.js"></script>
</body>
</html>
