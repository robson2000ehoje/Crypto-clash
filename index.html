<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto-clash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .header {
            background-color: #0d47a1;
            padding: 20px;
            font-size: 36px;
        }
        .faction-button {
            background-color: #ff9800;
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 20px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }
        .faction-button:hover {
            background-color: #e65100;
        }
        .game-container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        .game-box {
            border: 2px solid #fff;
            padding: 20px;
            margin: 10px;
            background-color: #333;
            width: 200px;
            text-align: center;
        }
        .game-box h2 {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        Crypto-clash
    </div>

    <div>
        <button class="faction-button" id="neoBlock">NeoBlock Corp</button>
        <button class="faction-button" id="daoMinion">DAOminion</button>
        <button class="faction-button" id="shadowHash">ShadowHash</button>
        <button class="faction-button" id="nacaoSatoshi">Nação Satoshi</button>
    </div>

    <div class="game-container">
        <div class="game-box">
            <h2>Campo de Batalha</h2>
            <p>Escolha uma ação</p>
            <button class="faction-button" id="attack">Atacar</button>
            <button class="faction-button" id="defend">Defender</button>
            <button class="faction-button" id="retreat">Retirar</button>
        </div>
    </div>

    <script>
        // Evento de clique para cada facção
        document.getElementById('neoBlock').addEventListener('click', function() {
            alert("Você escolheu NeoBlock Corp");
        });

        document.getElementById('daoMinion').addEventListener('click', function() {
            alert("Você escolheu DAOminion");
        });

        document.getElementById('shadowHash').addEventListener('click', function() {
            alert("Você escolheu ShadowHash");
        });

        document.getElementById('nacaoSatoshi').addEventListener('click', function() {
            alert("Você escolheu Nação Satoshi");
        });

        // Eventos para as ações no campo de batalha
        document.getElementById('attack').addEventListener('click', function() {
            alert("Você escolheu Atacar!");
        });

        document.getElementById('defend').addEventListener('click', function() {
            alert("Você escolheu Defender!");
        });

        document.getElementById('retreat').addEventListener('click', function() {
            alert("Você escolheu Retirar!");
        });
    </script>

</body>
</html>
