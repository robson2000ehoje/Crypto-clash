<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto-Clash</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(ellipse at center, #0b0c2a 0%, #000000 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 4em;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
      margin: 0.2em;
    }

    p {
      font-size: 1.5em;
      color: #ffffffcc;
      margin-bottom: 2em;
      text-align: center;
      max-width: 600px;
    }

    button {
      font-size: 1.2em;
      padding: 1em 2em;
      background-color: #ff5500;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff5500;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff3300;
      box-shadow: 0 0 20px #ff3300;
    }
  </style>
</head>
<body>
  <h1>Crypto-Clash</h1>
  <p>Bem-vindo ao campo de batalha das criptomoedas. Prepare-se para escolher seu lado na guerra digital.</p>
  <button onclick="window.location.href='faction-select.html'">Iniciar</button>
</body>
</html>
