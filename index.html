<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto-clash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .header {
            background-color: #0d47a1;
            padding: 20px;
            font-size: 36px;
        }
        .faction-button {
            background-color: #ff9800;
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 20px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }
        .faction-button:hover {
            background-color: #e65100;
        }
        .game-container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        .game-box {
            border: 2px solid #fff;
            padding: 20px;
            margin: 10px;
            background-color: #333;
            width: 200px;
            text-align: center;
        }
        .game-box h2 {
            font-size: 24px;
        }
        #status, #turn-info {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        Crypto-clash
    </div>

    <div>
        <button class="faction-button" id="neoBlock">NeoBlock Corp</button>
        <button class="faction-button" id="daoMinion">DAOminion</button>
        <button class="faction-button" id="shadowHash">ShadowHash</button>
        <button class="faction-button" id="nacaoSatoshi">Nação Satoshi</button>
    </div>

    <div class="game-container">
        <div class="game-box">
            <h2>Campo de Batalha</h2>
            <p>Escolha uma ação</p>
            <button class="faction-button" id="attack">Atacar</button>
            <button class="faction-button" id="defend">Defender</button>
            <button class="faction-button" id="retreat">Retirar</button>
        </div>
    </div>

    <div id="status"></div>
    <div id="turn-info"></div>

    <script>
        let playerFaction = '';
        let enemyFaction = '';
        let playerHP = 100;
        let enemyHP = 100;
        let isPlayerTurn = true;  // Controla os turnos

        // Função para atualizar o status na tela
        function updateStatus() {
            const statusText = `Você escolheu: ${playerFaction} \nInimigo: ${enemyFaction}`;
            document.getElementById('status').innerText = statusText;
            document.getElementById('turn-info').innerText = `Turno: ${isPlayerTurn ? "Seu" : "Inimigo"}`;

            // Atualiza os pontos de vida das facções
            document.getElementById('status').innerText += `\nPontos de vida: ${playerFaction} - ${playerHP} | ${enemyFaction} - ${enemyHP}`;
        }

        // Evento de clique para cada facção
        document.getElementById('neoBlock').addEventListener('click', function() {
            playerFaction = "NeoBlock Corp";
            enemyFaction = "DAOminion";
            playerHP = enemyHP = 100;  // Resetando os pontos de vida
            updateStatus();
        });

        document.getElementById('daoMinion').addEventListener('click', function() {
            playerFaction = "DAOminion";
            enemyFaction = "NeoBlock Corp";
            playerHP = enemyHP = 100;  // Resetando os pontos de vida
            updateStatus();
        });

        document.getElementById('shadowHash').addEventListener('click', function() {
            playerFaction = "ShadowHash";
            enemyFaction = "Nação Satoshi";
            playerHP = enemyHP = 100;  // Resetando os pontos de vida
            updateStatus();
        });

        document.getElementById('nacaoSatoshi').addEventListener('click', function() {
            playerFaction = "Nação Satoshi";
            enemyFaction = "ShadowHash";
            playerHP = enemyHP = 100;  // Resetando os pontos de vida
            updateStatus();
        });

        // Função para realizar as ações no campo de batalha
        function performAction(action) {
            if (playerHP <= 0 || enemyHP <= 0) {
                alert("O jogo acabou!");
                return;
            }

            if (!isPlayerTurn) {
                alert("Espere a vez do inimigo!");
                return;
            }

            let resultMessage = '';
            let damage = 0;

            if (action === 'atacar') {
                damage = Math.floor(Math.random() * 20) + 10;  // Dano aleatório entre 10 e 30
                enemyHP -= damage;
                resultMessage = `${playerFaction} atacou ${enemyFaction} e causou ${damage} de dano!`;
            } else if (action === 'defender') {
                resultMessage = `${playerFaction} se defendeu! Nenhum dano foi causado.`;
            } else if (action === 'retirar') {
                resultMessage = `${playerFaction} se retirou do campo de batalha!`;
                enemyHP = 0;  // Se retirar, o inimigo vence
            }

            isPlayerTurn = false;  // Alterna o turno
            alert(resultMessage);
            updateStatus();
            checkVictory();
            enemyTurn();
        }

        // Função que simula o turno do inimigo
        function enemyTurn() {
            if (playerHP <= 0 || enemyHP <= 0) {
                return;
            }

            setTimeout(() => {
                if (enemyHP <= 0) return;
                let enemyAction = Math.random() > 0.5 ? "atacar" : "defender";  // Inimigo escolhe aleatoriamente atacar ou defender
                let damage = 0;

                if (enemyAction === 'atacar') {
                    damage = Math.floor(Math.random() * 20) + 10;
                    playerHP -= damage;
                    alert(`${enemyFaction} atacou ${playerFaction} e causou ${damage} de dano!`);
                } else {
                    alert(`${enemyFaction} se defendeu!`);
                }

                isPlayerTurn = true;  // Volta para o turno do jogador
                updateStatus();
                checkVictory();
            }, 1000);
        }

        // Função para verificar vitória ou derrota
        function checkVictory() {
            if (playerHP <= 0) {
                alert(`${enemyFaction} venceu!`);
                resetGame();
            } else if (enemyHP <= 0) {
                alert(`${playerFaction} venceu!`);
                resetGame();
            }
        }

        // Função para reiniciar o jogo
        function resetGame() {
            playerHP = enemyHP = 100;
            isPlayerTurn = true;
            updateStatus();
        }

        // Eventos para as ações no campo de batalha
        document.getElementById('attack').addEventListener('click', function() {
            performAction('atacar');
        });

        document.getElementById('defend').addEventListener('click', function() {
            performAction('defender');
        });

        document.getElementById('retreat').addEventListener('click', function() {
            performAction('retirar');
        });

        updateStatus();
    </script>

</body>
</html>
