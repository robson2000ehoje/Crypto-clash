<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Clash - Escolha sua facção</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="welcome-container">
    <h1>Bem-vindo ao Crypto Clash</h1>
    <p>Escolha sua facção para iniciar a batalha:</p>

    <div class="faction-selection">
      <div class="faction" data-faction="NeoBlock">
        <img src="https://pixabay.com/pt/illustrations/cidade-cibernética-arranha-céus-2345678/" alt="NeoBlock Corp" class="faction-image">
        <span>NeoBlock Corp</span>
      </div>
      <div class="faction" data-faction="DAOminion">
        <img src="https://pixabay.com/pt/illustrations/rede-digital-conexões-luminosas-3456789/" alt="DAOminion" class="faction-image">
        <span>DAOminion</span>
      </div>
      <div class="faction" data-faction="ShadowHash">
        <img src="https://pixabay.com/pt/illustrations/figura-encapuzada-interface-holográfica-4567890/" alt="ShadowHash" class="faction-image">
        <span>ShadowHash</span>
      </div>
      <div class="faction" data-faction="Nação Satoshi">
        <img src="https://pixabay.com/pt/illustrations/símbolo-bitcoin-efeitos-luz-5678901/" alt="Nação Satoshi" class="faction-image">
        <span>Nação Satoshi</span>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll(".faction").forEach((faction) => {
      faction.addEventListener("click", () => {
        const selectedFaction = faction.getAttribute("data-faction");
        localStorage.setItem("faction", selectedFaction);

        faction.classList.add("clicked");

        setTimeout(() => {
          window.location.href = "battle-scene.html";
        }, 400); // tempo da animação
      });
    });
  </script>
</body>
</html>
