<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Clash - Escolha sua facção</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="welcome-container">
    <h1>Bem-vindo ao Crypto Clash</h1>
    <p>Escolha sua facção para iniciar a batalha:</p>

    <div class="faction-selection">
      <div class="faction" data-faction="NeoBlock">NeoBlock Corp</div>
      <div class="faction" data-faction="DAOminion">DAOminion</div>
      <div class="faction" data-faction="ShadowHash">ShadowHash</div>
      <div class="faction" data-faction="Nação Satoshi">Nação Satoshi</div>
    </div>
  </div>

  <script>
    document.querySelectorAll(".faction").forEach((faction) => {
      faction.addEventListener("click", () => {
        const selectedFaction = faction.getAttribute("data-faction");
        localStorage.setItem("faction", selectedFaction);

        faction.classList.add("clicked");

        setTimeout(() => {
          window.location.href = "battle-scene.html";
        }, 400); // tempo da animação
      });
    });
  </script>
</body>
</html>
