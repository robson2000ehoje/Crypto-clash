<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Crypto-Clash - Início da Batalha</title>
  <link rel="stylesheet" href="battle-start.css">
</head>
<body>
  <div class="battle-container">
    <h1 class="battle-title">Preparar para a Batalha!</h1>
    
    <div class="factions-display">
      <div class="faction player">
        <h2>Sua Facção</h2>
        <img src="imagens/neoblock.png" alt="Facção do Jogador">
        <p>NeoBlock Corp</p>
      </div>
      
      <span class="vs-text">VS</span>
      
      <div class="faction enemy">
        <h2>Inimigo</h2>
        <img src="imagens/daominion.png" alt="Facção Inimiga">
        <p>DAOminion</p>
      </div>
    </div>

    <p class="battle-tip">Dica: Controle o bloco antes que ele te controle.</p>
    
    <button id="startBattleBtn">Iniciar Batalha</button>
  </div>

  <div id="fade-overlay"></div>
  
  <script src="battle-start.js"></script>
</body>
</html>
